Mariner          = "🌊"
MidnightBSD      = "🌘"
Mint             = "🌿"
NetBSD           = "🚩"
NixOS            = "❄️ "
OpenBSD          = "🐡"
OpenCloudOS      = "☁️ "
openEuler        = "🦉"
openSUSE         = "🦎"
OracleLinux      = "🦴"
Pop              = "🍭"
Raspbian         = "🍓"
Redhat           = "🎩 "
RedHatEnterprise = "🎩 "
Redox            = "🧪"
Solus            = "⛵"
SUSE             = "🦎 "
Ubuntu           = "🎯 "
Unknown          = "❓ "
