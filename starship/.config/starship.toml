# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

format = """
${custom.distrobox}\
$battery\
$username\
$hostname\
$docker_context\
$directory\
$git_branch\
$git_status\
$git_state\
$git_metrics\
$python\
$character
"""
# $container\
# $custom\
# $add_newline \
# $os\
# $git_status\

command_timeout = 10000

[hostname]
ssh_only = true
format   = '[$ssh_symbol](bold blue) on [$hostname](bold red) '
disabled = false

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](green)"

[container]
symbol = "📦"
format = '[$symbol \[$name\]]($style) '

[git_branch]
format = "[$branch](style)"
style  = "purple"

[git_status]
format     = " [[($conflicted$untracked$modified$staged$renamed$deleted)](218)]($style)"
style      = "cyan"
conflicted = "🏳"
ahead      = "💨"
behind     = "😰"
diverged   = "😵"
untracked  = "🤷‍"
stashed    = "📦"
modified   = "📦"
staged     = "➕"
renamed    = "👅"
deleted    = "🔥"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\)'
style  = "bright-purple"

[cmd_duration]
format = "[$duration]($style)"
style  = "yellow"

[python]
format = " [$virtualenv]($style)"
style  = "bright-green"

[os]
disabled = false

[os.symbols]
Alpaquita        = "🔔"
Alpine           = "🏔️ "
Amazon           = "🙂"
Android          = "🤖"
Arch             = "🎗️ "
Artix            = "🎗️ "
