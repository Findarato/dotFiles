[battery]
full_symbol        = '🔋 '
charging_symbol    = '⚡️ '
discharging_symbol = '💀 '
disabled           = false

[line_break]
disabled = true

[custom.ssh_no_keys]
description = "SSH missing keys"
when        = "ssh-add -l | grep -q 'no identities'"
command     = "echo 🚫"
format      = "$symbol[$output]($style) "
shell       = ["bash", "--noprofile", "--norc"]
symbol      = "🔑"
style       = "bold fg:red"

