# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

format = """${custom.distrobox}\
$hostname\
$username\
$battery\
$python\
$directory\
$git_branch\
$git_status\
$line_break\
$character
"""
right_format = "$time"

# format = """

# $battery\
# $username\
# $docker_context\
# $directory\
# $git_branch\
# $git_status\
# $git_state\
# $git_metrics\
# $python\
# $character
# """


command_timeout = 10000

[hostname]
ssh_only = true
ssh_symbol= '🌐'
format   = '[$ssh_symbol](bold blue)[$hostname](bold red) '
detect_env_vars = ['!TMUX', 'SSH_CONNECTION']
disabled = false

[username]
style_root = 'bold red'
style_user = 'bold yellow'
format = '[$user]($style) '
show_always = false

[directory]
style = "blue"

[character]
success_symbol = "[❯](bold purple)"
error_symbol   = "[❯](bold red)"


[container]
symbol = "🫙"
format = '[$symbol \[$name\]]($style) '


# [git_status]
# style = "bold yellow"
# format = "[$all_status$ahead_behind]($style) "
# conflicted = "="
# ahead = " up:${count}"
# behind = " down:${count}"
# diverged = " up:${ahead_count} down:${behind_count}"
# untracked = " ?${count}"
# stashed = ""
# modified = " !${count}"
# staged = " +${count}"
# renamed = " r${count}"
# deleted = " x${count}"


[git_branch]
symbol = ""
style = "bold purple"
format = "[$branch]($style) "

[git_status]
format     = "[[($conflicted$untracked$modified$staged$renamed$deleted)](218)]($style)"
style = "bold yellow"
# conflicted = "🏳"
# ahead      = "💨"
# behind     = "😰"
# diverged   = "😵"
# untracked  = "🤷‍"
# stashed    = "📦"
# modified   = "📦"
# staged     = "➕"
# renamed    = "👅"
# deleted    = "🔥"
modified = " !${count}"
staged = " +${count}"
renamed = " r${count}"
deleted = " x${count}"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\)'
style  = "bright-purple"

[cmd_duration]
format = "[$duration]($style)"
style  = "yellow"

[python]
format = "[$virtualenv]($style) "
style  = "bright-green"

